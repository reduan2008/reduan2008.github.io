<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Chat</title>
    <meta
      name="description"
      content="Chat moderno conectado a la API de Gemini."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <span class="brand-mark">✦</span>
            <div>
              <strong>Gemini Chat</strong>
              <small>IA en la nube</small>
            </div>
          </div>
          <button id="new-chat-button" class="new-chat-button" type="button">
            + Nuevo chat
          </button>
        </div>

        <div class="history-panel">
          <div class="history-header">Historial</div>
          <div id="history-list" class="history-list">
            <button class="history-item active" type="button">Chat actual</button>
          </div>
        </div>
      </aside>

      <main class="chat-panel">
        <header class="chat-header">
          <div class="chat-header-title">
            <span class="model-label">Modelo activo</span>
            <strong id="active-model">gemini-flash-latest</strong>
          </div>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>

        <div id="thinking-indicator" class="thinking-indicator hidden" aria-live="polite">
          <span class="thinking-dot"></span>
          <span>Pensando...</span>
        </div>

        <form id="chat-form" class="composer">
          <div class="composer-inner">
            <textarea
              id="user-input"
              rows="1"
              placeholder="Pregunta lo que quieras..."
              aria-label="Escribe tu mensaje"
            ></textarea>
            <button type="submit" class="send-button" aria-label="Enviar mensaje">
              ➤
            </button>
          </div>
        </form>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
